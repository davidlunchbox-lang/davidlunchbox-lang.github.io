<title>釜山五天行程</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: phone-first single column. A sticky tab strip switches between five days, a to-check list, transport legs and a Korean phrase card. Each stop is one row: time on the left, name and Hangul with copy and map buttons on the right. */
:root {
  --paper: #f2f5f7;
  --card: #ffffff;
  --ink: #14232e;
  --mute: #5b6b77;
  --line: #d9e1e7;
  --accent: #0f5c8e;
  --accent-ink: #ffffff;
  --ok: #1e7a4a;
  --ok-bg: #e1f3e8;
  --warn: #8a5300;
  --warn-bg: #fff0d1;
  --tip-bg: #e6f0f7;
  --day1: #e8730c;
  --day2: #3f9a3a;
  --day3: #b58a00;
  --day4: #2d7fd0;
  --day5: #8a55a8;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-ko: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #0e1a22;
    --card: #15252f;
    --ink: #e6eef3;
    --mute: #9db0bd;
    --line: #26404f;
    --accent: #66b6ea;
    --accent-ink: #08202f;
    --ok: #7fd6a2;
    --ok-bg: #173826;
    --warn: #f2b85a;
    --warn-bg: #3b2c0c;
    --tip-bg: #1b3445;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #0e1a22;
  --card: #15252f;
  --ink: #e6eef3;
  --mute: #9db0bd;
  --line: #26404f;
  --accent: #66b6ea;
  --accent-ink: #08202f;
  --ok: #7fd6a2;
  --ok-bg: #173826;
  --warn: #f2b85a;
  --warn-bg: #3b2c0c;
  --tip-bg: #1b3445;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--paper);
}
.wrap { max-width: 640px; margin: 0 auto; }
header.top { padding-block: 18px 6px; }
h1 { margin: 0; font-size: 24px; line-height: 1.2; font-weight: 700; text-wrap: balance; }
.sub { margin: 4px 0 0; color: var(--mute); font-size: 13px; }
nav.tabs {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  background: var(--paper);
  border-bottom: 1px solid var(--line);
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding-inline: max(16px, env(safe-area-inset-left, 0px));
}
.tabs-inner { display: flex; gap: 6px; overflow-x: auto; padding-block: 10px; scrollbar-width: none; max-width: 640px; margin: 0 auto; }
.tabs-inner::-webkit-scrollbar { display: none; }
.tab {
  flex: none;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink);
  font: inherit;
  font-size: 14px;
  font-weight: 500;
  padding: 7px 13px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  cursor: pointer;
}
.tab:focus-visible, .btn:focus-visible, .chk:focus-visible, .switch:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.dayhead { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; padding-block: 18px 8px; }
.dayhead h2 { margin: 0; font-size: 20px; line-height: 1.2; }
.dayhead .meta { color: var(--mute); font-size: 13px; }
.switch {
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink);
  font: inherit;
  font-size: 13px;
  padding: 6px 11px;
  border-radius: 999px;
  cursor: pointer;
}
.switch[aria-pressed="true"] { background: var(--warn-bg); color: var(--warn); border-color: var(--warn); }
.stops { display: flex; flex-direction: column; gap: 10px; list-style: none; margin: 0; padding: 0; }
.stop {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px 14px;
  display: grid;
  grid-template-columns: 64px 1fr;
  gap: 4px 12px;
}
.time { font-family: var(--font-mono); font-size: 12.5px; color: var(--mute); font-variant-numeric: tabular-nums; padding-top: 3px; line-height: 1.35; }
.act { display: flex; justify-content: space-between; align-items: start; gap: 10px; }
.act strong { font-size: 16px; line-height: 1.35; font-weight: 700; }
.chip { flex: none; font-size: 12px; font-weight: 500; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.chip.ok { background: var(--ok-bg); color: var(--ok); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.place { color: var(--mute); font-size: 13.5px; margin-top: 1px; }
.ko-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; }
.ko {
  font-family: var(--font-ko);
  font-size: 17px;
  font-weight: 700;
  user-select: all;
  -webkit-user-select: all;
  word-break: keep-all;
  overflow-wrap: anywhere;
}
.btns { display: flex; gap: 6px; flex-wrap: wrap; }
.btn {
  font: inherit;
  font-size: 13px;
  font-weight: 500;
  padding: 5px 11px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--paper);
  color: var(--accent);
  text-decoration: none;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
}
.addr { margin-top: 6px; font-size: 13px; color: var(--mute); }
.addr .a { font-family: var(--font-ko); color: var(--ink); user-select: all; -webkit-user-select: all; overflow-wrap: anywhere; }
.line { margin-top: 6px; font-size: 13.5px; }
.line b { font-weight: 500; color: var(--mute); margin-right: 4px; }
.tip { margin-top: 8px; background: var(--tip-bg); border-radius: 8px; padding: 8px 10px; font-size: 13.5px; }
.tip b { color: var(--accent); margin-right: 4px; }
.empty { padding: 28px 8px; color: var(--mute); text-align: center; }
.sec { padding-block: 18px 6px; }
.sec h2 { margin: 0 0 4px; font-size: 20px; }
.sec p { margin: 0; color: var(--mute); font-size: 13.5px; }
.todo { display: grid; grid-template-columns: 26px 1fr; gap: 6px 10px; }
.chk { width: 22px; height: 22px; margin-top: 2px; accent-color: var(--accent); }
.todo.done .t, .todo.done .d { opacity: 0.5; text-decoration: line-through; }
.pri { font-size: 12px; font-weight: 700; padding: 1px 7px; border-radius: 6px; margin-right: 6px; }
.pri.h { background: var(--warn-bg); color: var(--warn); }
.pri.m, .pri.l { background: var(--tip-bg); color: var(--mute); }
.t { font-weight: 700; }
.d { color: var(--ink); font-size: 14px; margin-top: 2px; }
.w { color: var(--mute); font-size: 13px; margin-top: 4px; }
.leg { display: flex; flex-direction: column; gap: 3px; }
.leg .r { font-weight: 700; }
.leg .m { color: var(--mute); font-size: 13.5px; }
.leg .tm { font-family: var(--font-mono); font-size: 14px; font-variant-numeric: tabular-nums; }
.stop.single { grid-template-columns: 1fr; }
.phrase .zh { color: var(--mute); font-size: 13.5px; }
.phrase .rom { font-family: var(--font-mono); font-size: 12.5px; color: var(--mute); }
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  background: var(--ink);
  color: var(--paper);
  padding: 8px 16px;
  border-radius: 999px;
  font-size: 14px;
  z-index: 20;
}
.toast[hidden] { display: none; }
footer { margin-top: 28px; color: var(--mute); font-size: 12.5px; }
@media (prefers-reduced-motion: no-preference) {
  .tab, .btn, .switch { transition: background-color 0.15s, color 0.15s; }
}
@media (min-width: 520px) {
  body { font-size: 16px; }
  .stop { grid-template-columns: 76px 1fr; }
}
</style>

var state = { tab: "Day1", onlyWarn: false, done: {} };
try {
  var saved = JSON.parse(localStorage.getItem("fusan_state") || "{}");
  if (saved.tab) state.tab = saved.tab;
  if (saved.onlyWarn) state.onlyWarn = true;
  if (saved.done) state.done = saved.done;
} catch (e) {}
function persist() {
  try { localStorage.setItem("fusan_state", JSON.stringify(state)); } catch (e) {}
}

function el(tag, cls, text) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

var toastTimer = null;
function toast(msg) {
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.hidden = true; }, 1400);
}
function fallbackCopy(text) {
  var ta = document.createElement("textarea");
  ta.value = text;
  ta.setAttribute("readonly", "");
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  var ok = false;
  try { ok = document.execCommand("copy"); } catch (e) {}
  document.body.removeChild(ta);
  toast(ok ? "已複製" : "請長按文字手動複製");
}
function copyText(text) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast("已複製"); }, function () { fallbackCopy(text); });
      return;
    }
  } catch (e) {}
  fallbackCopy(text);
}

function mapTarget(ko) {
  var parts = ko.split("→");
  return parts[parts.length - 1].trim();
}
function gmapUrl(ko) {
  return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(mapTarget(ko) + " 부산");
}
function nmapUrl(ko) {
  return "https://map.naver.com/p/search/" + encodeURIComponent(mapTarget(ko));
}
function copyBtn(text, label) {
  var b = el("button", "btn", label || "複製");
  b.type = "button";
  b.addEventListener("click", function () { copyText(text); });
  return b;
}
function linkBtn(url, label) {
  var a = el("a", "btn", label);
  a.href = url;
  a.target = "_blank";
  a.rel = "noopener";
  return a;
}

var ADDR = {};
DATA.places.forEach(function (p) { ADDR[p.ko] = p; });

function renderTabs() {
  var box = document.getElementById("tabs");
  box.textContent = "";
  DAYS.concat(EXTRA).forEach(function (t) {
    var b = el("button", "tab");
    b.type = "button";
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", state.tab === t.key ? "true" : "false");
    if (t.color) {
      var d = el("span", "dot");
      d.style.background = t.color;
      b.appendChild(d);
    }
    b.appendChild(document.createTextNode(t.label));
    b.addEventListener("click", function () {
      state.tab = t.key;
      persist();
      renderTabs();
      renderView();
      window.scrollTo(0, 0);
    });
    box.appendChild(b);
  });
  var sel = box.querySelector('[aria-selected="true"]');
  if (sel && sel.scrollIntoView) { try { sel.scrollIntoView({ inline: "center", block: "nearest" }); } catch (e) {} }
}

function statusChip(s) {
  if (s.indexOf("✓") === 0) return el("span", "chip ok", "已查");
  if (s.indexOf("⚠") === 0) return el("span", "chip warn", "待確認");
  return null;
}

function stopCard(r) {

  li.appendChild(el("div", "time", r.time));
  var body = el("div", "");
  var head = el("div", "act");
  head.appendChild(el("strong", "", r.act));
  var chip = statusChip(r.status);
  if (chip) head.appendChild(chip);
  body.appendChild(head);
  if (r.place && r.place !== r.act) body.appendChild(el("div", "place", r.place));

  var ko = r.ko || "";
  var hasKo = ko && ko.charAt(0) !== "（";
  if (hasKo) {
    var row = el("div", "ko-row");
    row.appendChild(el("span", "ko", ko));
    var btns = el("div", "btns");
    btns.appendChild(copyBtn(ko, "複製"));
    btns.appendChild(linkBtn(gmapUrl(ko), "地圖"));
    btns.appendChild(linkBtn(nmapUrl(ko), "Naver"));
    row.appendChild(btns);
    body.appendChild(row);
    var p = ADDR[ko];
    if (p && p.addr && p.addr.charAt(0) !== "（") {
      var ad = el("div", "addr");
      ad.appendChild(el("span", "a", p.addr));
      ad.appendChild(document.createTextNode(" "));
      ad.appendChild(copyBtn(p.addr, "複製地址"));

    }
    if (p && p.phone) {
      var ph = el("div", "addr");
      ph.appendChild(document.createTextNode("電話 " + p.phone));
      body.appendChild(ph);
    }
  } else if (ko) {
    body.appendChild(el("div", "place", ko));
  }
  if (r.trans) {
    var tl = el("div", "line");
    tl.appendChild(el("b", "", "交通"));
    tl.appendChild(document.createTextNode(r.trans));
    body.appendChild(tl);
  }
  if (r.hours) {
    var hl = el("div", "line");
    hl.appendChild(el("b", "", "資料"));
    hl.appendChild(document.createTextNode(r.hours));
    body.appendChild(hl);
  }
  var info = r.note || "";
  var sug = "";
  var i = info.indexOf("✎");
  if (i >= 0) { sug = info.slice(i + 1).trim(); info = info.slice(0, i).trim(); }
  if (info) body.appendChild(el("div", "line", info));
  if (sug) {
    var tip = el("div", "tip");
    tip.appendChild(el("b", "", "建議"));
    tip.appendChild(document.createTextNode(sug));
    body.appendChild(tip);
  }
  li.appendChild(body);
  return li;
}

function renderDay(day) {
  var rows = DATA.rows.filter(function (r) { return r.day.indexOf(day.key) === 0; });
  var warnCount = rows.filter(function (r) { return r.status.indexOf("⚠") === 0; }).length;
  var frag = document.createDocumentFragment();
  var head = el("div", "dayhead");
  var left = el("div", "");
  left.appendChild(el("h2", "", day.label + "　" + day.date));
  left.appendChild(el("div", "meta", rows.length + " 項，" + warnCount + " 項待確認"));
  head.appendChild(left);
  var sw = el("button", "switch", "只看待確認");
  sw.type = "button";
  sw.setAttribute("aria-pressed", state.onlyWarn ? "true" : "false");
  sw.addEventListener("click", function () {
    state.onlyWarn = !state.onlyWarn;
    persist();
    renderView();
  });
  head.appendChild(sw);
  frag.appendChild(head);
  var list = el("ul", "stops");
  var shown = rows.filter(function (r) { return !state.onlyWarn || r.status.indexOf("⚠") === 0; });
  shown.forEach(function (r) { list.appendChild(stopCard(r)); });
  if (!shown.length) list.appendChild(el("li", "empty", "這一天沒有待確認的項目。"));
  frag.appendChild(list);
  return frag;
}

function renderTodo() {
  var frag = document.createDocumentFragment();
  var s = el("div", "sec");
  s.appendChild(el("h2", "", "出發前待確認"));
  s.appendChild(el("p", "", "做完就打勾，勾選會存在這支手機上。"));
  frag.appendChild(s);
  var list = el("ul", "stops");
  DATA.todo.forEach(function (t, idx) {
    var li = el("li", "stop single");
    var box = el("div", "todo");
    var key = "todo" + idx;
    var cb = el("input", "chk");
    cb.type = "checkbox";
    cb.id = "chk_" + idx;
    cb.checked = !!state.done[key];
    var txt = el("div", "");
    var tt = el("div", "t");
    var cls = t.pri === "高" ? "h" : (t.pri === "中" ? "m" : "l");
    tt.appendChild(el("span", "pri " + cls, t.pri));
    tt.appendChild(document.createTextNode(t.item));
    txt.appendChild(tt);
    txt.appendChild(el("div", "d", t.what));
    txt.appendChild(el("div", "w", "看哪裡：" + t.where + (t.note ? "　" + t.note : "")));
    txt.className = "tx";
    box.className = "todo" + (cb.checked ? " done" : "");
    tt.className = "t";
    cb.addEventListener("change", function () {
      state.done[key] = cb.checked;
      persist();
      box.className = "todo" + (cb.checked ? " done" : "");
    });
    box.appendChild(cb);
    box.appendChild(txt);
    li.appendChild(box);
    list.appendChild(li);
  });
  frag.appendChild(list);

  var s2 = el("div", "sec");
  s2.appendChild(el("h2", "", "預約與候位"));
  frag.appendChild(s2);
  var l2 = el("ul", "stops");
  DATA.resv.forEach(function (r) {
    var li = el("li", "stop single");
    var d = el("div", "leg");
    d.appendChild(el("div", "r", r.day + "　" + r.item));
    d.appendChild(el("div", "m", r.how + "　" + r.status + (r.note ? "　" + r.note : "")));
    li.appendChild(d);
    l2.appendChild(li);
  });
  frag.appendChild(l2);
  return frag;
}

function renderRoute() {
  var frag = document.createDocumentFragment();
  var s = el("div", "sec");
  s.appendChild(el("h2", "", "交通時間"));
  s.appendChild(el("p", "", "多半是網站的估計，不是班次表。出發前用 Naver Map 或 Google 地圖看即時班次。"));
  frag.appendChild(s);
  var list = el("ul", "stops");
  DATA.route.forEach(function (r) {
    var li = el("li", "stop single");
    var d = el("div", "leg");
    d.appendChild(el("div", "m", r.day));
    d.appendChild(el("div", "r", r.leg));
    d.appendChild(el("div", "tm", r.time));
    d.appendChild(el("div", "m", r.how + (r.conf ? "　" + r.conf : "") + (r.note ? "　" + r.note : "")));
    li.appendChild(d);
    list.appendChild(li);
  });
  frag.appendChild(list);
  return frag;
}

function renderTalk() {
  var frag = document.createDocumentFragment();
  var s = el("div", "sec");
  s.appendChild(el("h2", "", "韓文小抄"));
  s.appendChild(el("p", "", "點「複製」，貼給店員或司機看。"));
  frag.appendChild(s);
  var list = el("ul", "stops");
  DATA.talk.forEach(function (p) {
    var li = el("li", "stop single phrase");
    li.appendChild(el("div", "zh", p.zh));
    var row = el("div", "ko-row");
    row.appendChild(el("span", "ko", p.ko));
    var btns = el("div", "btns");
    btns.appendChild(copyBtn(p.ko, "複製"));
    row.appendChild(btns);
    li.appendChild(row);
    li.appendChild(el("div", "rom", p.rom));
    list.appendChild(li);
  });
  frag.appendChild(list);
  return frag;
}

function renderView() {
  var v = document.getElementById("view");
  v.textContent = "";
  var day = DAYS.filter(function (d) { return d.key === state.tab; })[0];
  if (day) v.appendChild(renderDay(day));
  else if (state.tab === "todo") v.appendChild(renderTodo());
  else if (state.tab === "route") v.appendChild(renderRoute());
  else v.appendChild(renderTalk());
}

(function init() {
  var total = DATA.rows.length;
  var warn = DATA.rows.filter(function (r) { return r.status.indexOf("⚠") === 0; }).length;
  document.getElementById("counts").textContent = total + " 項，" + warn + " 項待確認";
  renderTabs();
  renderView();
})();
</script>
